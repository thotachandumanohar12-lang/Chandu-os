<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chandu OS</title>
    <link rel="manifest" href="manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 p-4 min-h-screen">

    <div class="max-w-md mx-auto space-y-4">
        <!-- Header -->
        <div class="flex justify-between items-center bg-slate-900 p-4 rounded-xl border border-slate-800">
            <div>
                <h1 class="text-xl font-bold tracking-wide">CHANDU OS <span class="text-xs bg-indigo-600 px-2 py-0.5 rounded">PRO</span></h1>
                <p class="text-xs text-slate-400">Daily Routine Timetable & Alarms</p>
            </div>
            <button onclick="addSlot()" class="bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-2 px-3 rounded-lg text-sm">+ Add Slot</button>
        </div>

        <!-- Routine Slots List -->
        <div id="slotContainer" class="space-y-3">
            <!-- Dynamic Slots Load Avthai -->
        </div>
    </div>

    <script>
        // LocalStorage nundi data load cheyadam
        let slots = JSON.parse(localStorage.getItem('chandu_slots')) || [
            { id: 1, title: 'Early Morning Wake Up', time: '05:30' },
            { id: 2, title: 'Breakfast & Refresh', time: '08:00' }
        ];

        // Screen meeda Slots Display Chese Function
        function renderSlots() {
            const container = document.getElementById('slotContainer');
            container.innerHTML = '';
            
            slots.forEach((slot, index) => {
                container.innerHTML += `
                    <div class="flex items-center justify-between bg-slate-900 p-3 rounded-xl border border-slate-800">
                        <input type="text" value="${slot.title}" onchange="updateTitle(${index}, this.value)" class="bg-transparent text-slate-200 font-medium focus:outline-none w-1/2">
                        <div class="flex items-center gap-2">
                            <input type="time" value="${slot.time}" onchange="updateTime(${index}, this.value)" class="bg-slate-800 text-indigo-400 font-bold p-2 rounded-lg border border-slate-700 cursor-pointer text-sm">
                            <button onclick="deleteSlot(${index})" class="text-red-400 hover:text-red-300 font-bold px-2">✕</button>
                        </div>
                    </div>
                `;
            });
            localStorage.setItem('chandu_slots', JSON.stringify(slots));
        }

        // 1. Add New Slot Function
        function addSlot() {
            const title = prompt("Slot Title Enter Cheyandi:", "New Task");
            if (title) {
                slots.push({ id: Date.now(), title: title, time: "09:00" });
                renderSlots();
            }
        }

        // 2. Change Time Function
        function updateTime(index, newTime) {
            slots[index].time = newTime;
            localStorage.setItem('chandu_slots', JSON.stringify(slots));
        }

        // 3. Change Title Function
        function updateTitle(index, newTitle) {
            slots[index].title = newTitle;
            localStorage.setItem('chandu_slots', JSON.stringify(slots));
        }

        // 4. Delete Slot Function
        function deleteSlot(index) {
            slots.splice(index, 1);
            renderSlots();
        }

        // App Start Ayyinapudu Slots Load Cheyali
        document.addEventListener('DOMContentLoaded', renderSlots);
    </script>
</body>
</html>
